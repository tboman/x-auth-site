# Builds, migrates, and deploys the 8 Go services to Cloud Run.
#
# Infrastructure (Cloud Run services, migration jobs, Cloud SQL, Redis,
# secrets) is managed by Terraform in deploy/terraform — this workflow only
# moves images. Authentication uses Workload Identity Federation; see
# deploy/terraform/README.md for the one-time setup of the two secrets:
#   GCP_WIF_PROVIDER  projects/<num>/locations/global/workloadIdentityPools/...
#   GCP_DEPLOY_SA     deploy-github@xauth-2026.iam.gserviceaccount.com

name: Deploy services

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "deploy/docker/**"
      - ".github/workflows/deploy-services.yml"
  workflow_dispatch:

concurrency:
  group: deploy-services
  cancel-in-progress: false

env:
  PROJECT_ID: xauth-2026
  REGION: europe-north1
  REPO: europe-north1-docker.pkg.dev/xauth-2026/x-auth

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and push images
        run: |
          set -euo pipefail
          for svc in transaction risk authentication authenticator persona pool broker grant fido id; do
            echo "::group::build ${svc}-service"
            docker build -t "${REPO}/${svc}-service:${GITHUB_SHA}" \
              -f "services/${svc}-service/Dockerfile" .
            docker push "${REPO}/${svc}-service:${GITHUB_SHA}"
            echo "::endgroup::"
          done
          echo "::group::build migrate"
          docker build -t "${REPO}/migrate:${GITHUB_SHA}" \
            -f deploy/docker/Dockerfile.migrate .
          docker push "${REPO}/migrate:${GITHUB_SHA}"
          echo "::endgroup::"

      - name: Run database migrations
        run: |
          set -euo pipefail
          declare -A short=(
            [transaction]=txn [risk]=risk [authentication]=auth [authenticator]=authr
            [persona]=persona [pool]=pool [broker]=broker [grant]=grant [fido]=fido [id]=id
          )
          for svc in transaction risk authentication authenticator persona pool broker grant fido id; do
            job="migrate-${short[$svc]}"
            echo "::group::${job}"
            gcloud run jobs update "${job}" \
              --image "${REPO}/migrate:${GITHUB_SHA}" \
              --region "${REGION}" --quiet
            gcloud run jobs execute "${job}" \
              --region "${REGION}" --wait --quiet
            echo "::endgroup::"
          done

      - name: Deploy services
        run: |
          set -euo pipefail
          for svc in transaction risk authentication authenticator persona pool broker grant fido id; do
            echo "::group::deploy ${svc}-service"
            gcloud run services update "${svc}-service" \
              --image "${REPO}/${svc}-service:${GITHUB_SHA}" \
              --region "${REGION}" --quiet
            echo "::endgroup::"
          done

      - name: Smoke-check public services
        run: |
          set -euo pipefail
          PROJECT_NUMBER=$(gcloud projects describe "${PROJECT_ID}" --format='value(projectNumber)')
          # Google's frontend reserves /healthz on run.app hosts and answers 404
          # itself — the request never reaches the container (verified on the
          # first standalone deploy). Probe real routes instead: discovery docs
          # on the OIDC services; a GET to POST-only /v1/advice (app-level 405)
          # on transaction-service.
          declare -A path=( [transaction-service]=/v1/advice
                            [authentication-service]=/.well-known/openid-configuration
                            [broker-service]=/.well-known/oauth-authorization-server
                            [fido-service]=/v1/mds/status
                            [id-service]=/.well-known/jwks.json )
          declare -A want=( [transaction-service]=405
                            [authentication-service]=200
                            [broker-service]=200
                            [fido-service]=400
                            [id-service]=200 )
          for svc in transaction-service authentication-service broker-service fido-service id-service; do
            url="https://${svc}-${PROJECT_NUMBER}.${REGION}.run.app${path[$svc]}"
            echo "checking ${url} (want ${want[$svc]})"
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "${url}" || echo 000)
              [ "${code}" = "${want[$svc]}" ] && break
              [ "${attempt}" = 5 ] && { echo "got ${code}, want ${want[$svc]}"; exit 1; }
              sleep 3
            done
          done
