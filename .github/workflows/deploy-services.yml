# Builds, migrates, and deploys the DEPLOYED Go services to Cloud Run.
#
# Only the five services actually running in prod are rolled out here
# (authentication, authenticator, risk, fido, id — the low-cost standalone
# footprint). transaction/persona/pool/broker/grant have no Cloud Run
# service or migrate job yet; add them back to the three lists below when
# they are provisioned.
#
# Deploys are DELIBERATE: manual trigger only (workflow_dispatch), no
# push-triggered rollouts. Databases are Neon — each migrate job carries its
# own PG_DSN from Secret Manager; this workflow only moves images.
# Authentication uses Workload Identity Federation; see
# deploy/terraform/README.md for the one-time setup of the two secrets:
#   GCP_WIF_PROVIDER  projects/<num>/locations/global/workloadIdentityPools/...
#   GCP_DEPLOY_SA     deploy-github@xauth-2026.iam.gserviceaccount.com

name: Deploy services

on:
  workflow_dispatch:

concurrency:
  group: deploy-services
  cancel-in-progress: false

env:
  PROJECT_ID: xauth-2026
  REGION: europe-north1
  REPO: europe-north1-docker.pkg.dev/xauth-2026/x-auth

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and push images
        run: |
          set -euo pipefail
          for svc in authentication authenticator risk fido id; do
            echo "::group::build ${svc}-service"
            docker build -t "${REPO}/${svc}-service:${GITHUB_SHA}" \
              -f "services/${svc}-service/Dockerfile" .
            docker push "${REPO}/${svc}-service:${GITHUB_SHA}"
            echo "::endgroup::"
          done
          echo "::group::build migrate"
          docker build -t "${REPO}/migrate:${GITHUB_SHA}" \
            -f deploy/docker/Dockerfile.migrate .
          docker push "${REPO}/migrate:${GITHUB_SHA}"
          echo "::endgroup::"

      - name: Run database migrations
        run: |
          set -euo pipefail
          declare -A short=(
            [authentication]=auth [authenticator]=authr [risk]=risk [fido]=fido [id]=id
          )
          for svc in authentication authenticator risk fido id; do
            job="migrate-${short[$svc]}"
            echo "::group::${job}"
            gcloud run jobs update "${job}" \
              --image "${REPO}/migrate:${GITHUB_SHA}" \
              --region "${REGION}" --quiet
            gcloud run jobs execute "${job}" \
              --region "${REGION}" --wait --quiet
            echo "::endgroup::"
          done

      - name: Deploy services
        run: |
          set -euo pipefail
          for svc in authentication authenticator risk fido id; do
            echo "::group::deploy ${svc}-service"
            gcloud run services update "${svc}-service" \
              --image "${REPO}/${svc}-service:${GITHUB_SHA}" \
              --region "${REGION}" --quiet
            echo "::endgroup::"
          done

      - name: Smoke-check public services
        run: |
          set -euo pipefail
          PROJECT_NUMBER=$(gcloud projects describe "${PROJECT_ID}" --format='value(projectNumber)')
          # Google's frontend reserves /healthz on run.app hosts and answers 404
          # itself — the request never reaches the container (verified on the
          # first standalone deploy). Probe real routes instead. Only the
          # public-ingress services are checkable from here: authenticator and
          # risk are internal-only.
          declare -A path=( [authentication-service]=/.well-known/openid-configuration
                            [fido-service]=/v1/mds/status
                            [id-service]=/.well-known/jwks.json )
          declare -A want=( [authentication-service]=200
                            [fido-service]=400
                            [id-service]=200 )
          for svc in authentication-service fido-service id-service; do
            url="https://${svc}-${PROJECT_NUMBER}.${REGION}.run.app${path[$svc]}"
            echo "checking ${url} (want ${want[$svc]})"
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "${url}" || echo 000)
              [ "${code}" = "${want[$svc]}" ] && break
              [ "${attempt}" = 5 ] && { echo "got ${code}, want ${want[$svc]}"; exit 1; }
              sleep 3
            done
          done
